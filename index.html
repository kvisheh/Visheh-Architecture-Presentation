<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Architecture Presentation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="presentation">

        <header class="top-bar">
            <div class="project-name">
                VISHEH ARCHITECTURE
            </div>

            <div class="project-label">
                RESIDENTIAL PROJECT
            </div>
        </header>


        <main class="main-content">

            <section class="intro">

                <p class="eyebrow">
                    INTERACTIVE PRESENTATION
                </p>

                <h1>
                    Explore the House
                </h1>

                <p class="description">
                    Select a camera position to explore the proposed interior.
                </p>

            </section>


            <section class="floor-plan-container">

                <div class="floor-plan">

                    <div class="plan-title">
                        FLOOR PLAN
                    </div>

                    <!-- Camera positions -->
                    <button class="camera camera-01">
                        <span>01</span>
                    </button>

                    <button class="camera camera-02">
                        <span>02</span>
                    </button>

                    <button class="camera camera-03">
                        <span>03</span>
                    </button>

                    <button class="camera camera-04">
                        <span>04</span>
                    </button>

                    <button class="camera camera-05">
                        <span>05</span>
                    </button>

                </div>

            </section>

        </main>


        <footer class="bottom-bar">

            <span>
                SELECT A CAMERA TO BEGIN
            </span>

            <span>
                01 — 05
            </span>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
